name: Refresh profile visuals
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
  push:
    paths:
      - '.github/workflows/profile-visuals.yml'
permissions:
  contents: write
concurrency:
  group: profile-visuals
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build visuals from public GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: jawad-elkharrati
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, html
          from pathlib import Path
          from datetime import datetime, timezone
          user = os.environ['PROFILE_USER']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'profile-dashboard', 'Accept': 'application/vnd.github+json'}
          def api(url, data=None):
              req = urllib.request.Request(url, data=json.dumps(data).encode() if data else None, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          repos = []
          page = 1
          while True:
              batch = api(f'https://api.github.com/users/{user}/repos?type=owner&per_page=100&page={page}')
              repos.extend(r for r in batch if not r['fork'] and not r['private'])
              if len(batch) < 100:
                  break
              page += 1
          profile = api(f'https://api.github.com/users/{user}')
          query = 'query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date contributionCount weekday}}}}}}'
          result = api('https://api.github.com/graphql', {'query': query, 'variables': {'login': user}})
          if result.get('errors'):
              raise RuntimeError('GitHub contribution query failed')
          calendar = result['data']['user']['contributionsCollection']['contributionCalendar']
          languages = {}
          for repo in repos:
              for name, size in api(repo['languages_url']).items():
                  languages[name] = languages.get(name, 0) + size
          stamp = datetime.now(timezone.utc).strftime('%d %b %Y / %H:%M UTC')
          colors = ['#38bdf8', '#a78bfa', '#34d399', '#fbbf24', '#fb7185']
          def text(x, y, value, size=14, color='#94a3b8', weight=400):
              return f'<text x="{x}" y="{y}" fill="{color}" font-family="Segoe UI,Arial,sans-serif" font-size="{size}" font-weight="{weight}">{html.escape(str(value))}</text>'
          def canvas(height, title):
              return f'<svg xmlns="http://www.w3.org/2000/svg" width="900" height="{height}" viewBox="0 0 900 {height}" role="img"><title>{html.escape(title)}</title><rect x="1" y="1" width="898" height="{height-2}" rx="18" fill="#0d1117" stroke="#30363d"/>'
          svg = canvas(330, 'Public GitHub activity dashboard for ' + user)
          svg += text(30, 36, 'GITHUB / AT A GLANCE', 13, '#38bdf8', 700)
          svg += text(30, 60, 'Real projects. Public activity. Always evolving.', 16, '#e2e8f0', 600)
          metrics = [(len(repos), 'Public original repos'), (sum(r['stargazers_count'] for r in repos), 'Stars on original repos'), (profile['followers'], 'Followers'), (calendar['totalContributions'], 'Contributions / last year')]
          for i, (value, label) in enumerate(metrics):
              x = 30 + i * 216
              svg += f'<rect x="{x}" y="83" width="195" height="96" rx="10" fill="#161b22"/>'
              svg += text(x+16, 125, value, 30, colors[i], 700)
              svg += text(x+16, 154, label, 12)
          svg += text(30, 211, 'LANGUAGE MIX', 12, '#e2e8f0', 700)
          top = sorted(languages.items(), key=lambda item: item[1], reverse=True)
          shown = top[:4]
          if len(top) > 4:
              shown.append(('Other', sum(size for _, size in top[4:])))
          total = sum(languages.values()) or 1
          x = 30
          for i, (name, size) in enumerate(shown):
              width = 840 * size / total
              svg += f'<rect x="{x:.2f}" y="226" width="{width:.2f}" height="9" fill="{colors[i]}"/>'
              svg += text(30+i*172, 263, f'{name} {size/total:.1%}', 12, colors[i])
              x += width
          svg += text(30, 307, 'GitHub API / public, owned, non-fork repositories', 11)
          svg += text(610, 307, stamp, 11)
          svg += '</svg>'
          Path('assets').mkdir(exist_ok=True)
          Path('assets/github-dashboard.svg').write_text(svg)
          svg = canvas(285, 'Contribution arcade: one tile per day, brightness represents contribution count')
          svg += text(30, 35, 'CONTRIBUTION / ARCADE', 13, '#34d399', 700)
          svg += text(30, 58, 'A year of building, one day at a time.', 14)
          for i in range(55):
              x, y = (i * 137 + 31) % 850 + 25, (i * 41) % 175 + 73
              svg += f'<circle cx="{x}" cy="{y}" r="1" fill="#64748b" opacity="0.35"/>'
          for col, week in enumerate(calendar['weeks']):
              for day in week['contributionDays']:
                  count = day['contributionCount']
                  color = '#1b2530' if count == 0 else '#0e4429' if count < 3 else '#006d32' if count < 6 else '#26a641' if count < 10 else '#39d353'
                  x, y = 30+col*16, 81+day['weekday']*16
                  label = f"{day['date']}: {count} contributions"
                  svg += f'<rect x="{x}" y="{y}" width="12" height="12" rx="2" fill="{color}"><title>{label}</title></rect>'
          svg += '<g><animateTransform attributeName="transform" type="translate" values="40 224;840 224;40 224" dur="18s" repeatCount="indefinite"/><path d="M0,-12 L9,9 L0,4 L-9,9 Z" fill="#38bdf8"/><path d="M-3,10 L0,19 L3,10" fill="#fbbf24"><animate attributeName="opacity" values="1;0.3;1" dur="0.4s" repeatCount="indefinite"/></path><rect x="-1" y="-28" width="2" height="9" fill="#fbbf24"><animate attributeName="y" values="-28;-150" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.2s" repeatCount="indefinite"/></rect></g>'
          svg += text(30, 265, str(calendar['totalContributions']) + ' contributions / rolling year', 12, '#e2e8f0')
          svg += text(615, 265, 'Less', 11)
          for i, color in enumerate(['#1b2530','#0e4429','#006d32','#26a641','#39d353']):
              svg += f'<rect x="{650+i*17}" y="255" width="12" height="12" rx="2" fill="{color}"/>'
          svg += text(742, 265, 'More', 11)
          svg += '</svg>'
          Path('assets/contribution-arcade.svg').write_text(svg)
          print('Generated both profile visuals from GitHub data.')
          
          PY
      - name: Save refreshed visuals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-dashboard.svg assets/contribution-arcade.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public GitHub dashboard and contribution arcade'
          git pull --rebase
          git push
